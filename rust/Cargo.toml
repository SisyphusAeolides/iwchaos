[package]
name = "iwchaos-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[lib]
name = "iwchaos_core"
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
