PACKAGE_NAME="iwchaos"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="iwchaos"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"

# Pre-build: Idris stubs, Fortran chaos objects, Rust staticlib, vendor tree.
MAKE[0]="make modules KERNEL_SRC=${kernel_source_dir} CONFIG_DEBUG_INFO_BTF_MODULES=n"
CLEAN="make clean"
