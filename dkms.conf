# DKMS builds the Intel modules using source selected for each target kernel.
PACKAGE_NAME="iwchaos"
PACKAGE_VERSION="0.2.1"

BUILT_MODULE_NAME[0]="iwlwifi"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/updates/iwchaos"

BUILT_MODULE_NAME[1]="iwlmvm"
BUILT_MODULE_LOCATION[1]=""
DEST_MODULE_LOCATION[1]="/updates/iwchaos"

BUILT_MODULE_NAME[2]="iwldvm"
BUILT_MODULE_LOCATION[2]=""
DEST_MODULE_LOCATION[2]="/updates/iwchaos"

BUILT_MODULE_NAME[3]="iwchaos_policy"
BUILT_MODULE_LOCATION[3]=""
DEST_MODULE_LOCATION[3]="/updates/iwchaos"

MAKE[0]="make modules KERNEL_SRC=${kernel_source_dir} KERNELRELEASE=${kernelver} IWCHAOS_MODE=auto"
CLEAN="make clean KERNEL_SRC=${kernel_source_dir} KERNELRELEASE=${kernelver}"
AUTOINSTALL="yes"
REMAKE_INITRD="yes"
